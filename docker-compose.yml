version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: fcf-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fcf_db
      POSTGRES_USER: fcf_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_db_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcf_user -d fcf_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fcf-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fcf_user:${DB_PASSWORD:-change_me_db_password}@db:5432/fcf_db
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret}
      COMPILER_SERVICE_URL: http://compiler-service:8000
      COMPILER_SERVICE_API_KEY: ${COMPILER_API_KEY:-change_me_compiler_service_secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      NODE_ENV: production
      PORT: 4000
    ports:
      - "4000:4000"

  # Compiler Microservice
  compiler-service:
    build:
      context: ./compiler-service
      dockerfile: Dockerfile
    container_name: fcf-compiler
    restart: unless-stopped
    environment:
      COMPILER_API_KEY: ${COMPILER_API_KEY:-change_me_compiler_service_secret}
      COMPILER_MOCK_MODE: false
      COMPILER_SANDBOX_IMAGE: fcf-sandbox:latest
      COMPILER_DEBUG: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Allow Docker-in-Docker for sandbox
    ports:
      - "8000:8000"

  # Frontend (production serve)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fcf-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
    name: fcf-pgdata
